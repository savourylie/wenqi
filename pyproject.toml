[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wenqi"
version = "2.0.0"
description = "以漢語語言學為基礎的中文寫作潤飾引擎：去除翻譯腔與歐化句法，保留作者原有風格。"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # 離線建置工具：產出繁體優化詞典 config/jieba_dict_traditional.txt
    # （scripts/build_traditional_dict.py，TICKET-003）。執行期不需要。
    "opencc-python-reimplemented>=0.1.7",
]

[tool.setuptools]
packages = ["engine", "engine.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]