[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wenqi"
version = "2.0.0"
description = "以漢語語言學為基礎的中文寫作潤飾引擎：去除翻譯腔與歐化句法，保留作者原有風格。"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["engine", "engine.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]